[project]
name = "fc-clubs-analytics"
version = "0.1.0"
description = "Local, privacy-filtered Clubs analytics with dbt and DuckDB"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core>=1.10,<1.11",
  "dbt-duckdb>=1.10,<1.11",
  "duckdb>=1.3,<2",
  "impit>=0.13.2,<0.14",
]

[project.scripts]
fc-clubs = "fc_clubs.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "sqlfluff>=3,<5"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fc_clubs"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
